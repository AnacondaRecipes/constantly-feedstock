{% set name = "constantly" %}
{% set version = "15.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 586372eb92059873e29eba4f9dec8381541b4d3834660707faf8ba59146dfc35

build:
  number: 1
  script: pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  host:
    - python
    - setuptools
    - pip
    - wheel
  run:
    - python

test:
  imports:
    - constantly
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/twisted/constantly
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Symbolic constants in Python
  description: |
    A library that provides symbolic constant support.
    It includes collections and constants with text, numeric, and bit flag values.
    Originally twisted.python.constants from the Twisted project.
  doc_url: https://constantly.readthedocs.io/
  dev_url: https://github.com/twisted/constantly

extra:
  recipe-maintainers:
    - isuruf
